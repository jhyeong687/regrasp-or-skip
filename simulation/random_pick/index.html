<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R7 · RGB-D 파지 실험</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#e9eef4;background:#11151a;--panel:#191f26;--line:#313c46;--muted:#aab7c7;--mint:#8bdccb}
    *{box-sizing:border-box}body{margin:0}main{max-width:1450px;margin:auto;padding:clamp(14px,2.7vw,36px);display:grid;gap:16px}
    h1,h2,p{margin:0}h1{font-size:clamp(22px,4vw,38px);letter-spacing:-.045em;line-height:1.2}h2{font-size:15px;font-weight:650}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .sub{margin-top:6px;font-size:13px;color:var(--muted)}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--mint);font-size:12px;white-space:nowrap}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
    .metric{padding:10px 12px;min-height:67px}.value{font-size:clamp(15px,3.4vw,27px);font-variant-numeric:tabular-nums;font-weight:670;white-space:nowrap}
    .caption{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
    .view{display:grid;grid-template-columns:minmax(0,1.14fr) minmax(0,1fr);gap:12px}
    .card{overflow:hidden;min-width:0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px;min-height:45px}
    .cardhead span{font-size:11px;color:var(--muted);text-align:right}.card img{display:block;width:100%;aspect-ratio:1.77;object-fit:contain;background:#111820}
    .card img.sensors{aspect-ratio:1.62}.card img:not([src]){visibility:hidden}
    section.status{padding:10px 14px 13px;display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
    #phase{font-weight:600;font-size:13px}#batchClock{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
    progress{width:100%;height:5px;border:0;border-radius:5px;background:#29343e;accent-color:var(--mint)}
    progress::-webkit-progress-bar{background:#29343e;border-radius:5px}progress::-webkit-progress-value{background:var(--mint);border-radius:5px}
    .evidence{padding:10px 12px;min-height:42px;font-size:12px;line-height:1.5;color:#bdc9d6;overflow-wrap:anywhere}
    .scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}
    th,td{padding:8px 8px;text-align:right;border-top:1px solid #29333d}
    th:first-child,td:first-child{padding-left:12px}th:last-child,td:last-child{padding-right:12px}
    th{color:var(--muted);font-weight:500}td:nth-child(2),th:nth-child(2){text-align:left}
    .good{color:var(--mint)}.bad{color:#f9ac92}.time{font-weight:650;color:#f4e4ac}
    a,button{color:#c0d8f5}a{text-underline-offset:3px}button{font:inherit;border:1px solid var(--line);background:#222c36;border-radius:6px;padding:3px 6px;cursor:pointer}
    button[aria-pressed="true"]{border-color:var(--mint);color:var(--mint)}button:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
    .tools{white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:11px}
    @media(max-width:790px){.view{grid-template-columns:1fr}}
    @media(max-width:460px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body><main>
  <header>
    <div><h1>무작위 RGB-D 파지</h1><p class="sub">SO-ARM101 R7 · MuJoCo · 물체 3종 × 4회</p></div>
    <div class="pill">GPT-6.2 Astra · xhigh</div>
  </header>
  <section class="metrics" aria-label="실험 집계">
    <div class="metric"><div class="value" id="count">0 / 12</div><div class="caption">완료</div></div>
    <div class="metric"><div class="value good" id="success">—</div><div class="caption">트레이 안착</div></div>
    <div class="metric"><div class="value" id="wall">—</div><div class="caption">회당 중앙값 · 추론 포함</div></div>
    <div class="metric"><div class="value" id="inference">—</div><div class="caption">회당 추론 대기 중앙값</div></div>
  </section>
  <section class="card status">
    <div class="row"><span id="phase" role="status">실험 시작 대기</span><span id="batchClock"></span></div>
    <progress id="progress" max="12" value="0" aria-label="완료된 실험 횟수"></progress>
  </section>
  <div class="view">
    <section class="card">
      <div class="cardhead"><h2>MuJoCo 장면</h2><span id="sceneLabel">실시간</span></div>
      <img id="sceneImage" alt="SO-ARM101 로봇과 청록색 트레이">
    </section>
    <section class="card">
      <div class="cardhead"><h2>Astra 관측</h2><span>RGB 3개 · 손목 깊이 1개</span></div>
      <img id="rgbd" class="sensors" alt="세 카메라와 손목 깊이, 파지 후보가 표시된 입력">
      <p class="evidence" id="evidence">모델이 사용한 관측과 파지 근거가 표시됩니다.</p>
    </section>
  </div>
  <section class="card">
    <div class="cardhead"><h2>회차별 결과</h2><div class="tools">
      <button hidden id="liveButton" type="button">실시간 보기</button>
      <a hidden id="csv" href="runs.csv" download>CSV</a>
      <a hidden id="json" href="results.json" download>JSON</a>
    </div></div>
    <div class="scroll"><table>
      <thead><tr><th scope="col">회차</th><th scope="col">물체</th><th scope="col">파지</th>
      <th scope="col">총 시간</th><th scope="col">추론</th><th scope="col">물리 시간</th>
      <th scope="col">안착</th><th scope="col">재생</th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </section>
</main>
<script>
  const el = (id) => document.getElementById(id);
  const shapes = {brick:"직육면체", cylinder:"원기둥", bar:"긴 직육면체"};
  const phases = {reset:"초기 위치 및 자세 설정", inference:"Astra 추론 대기", approach:"물체 접근",
    descend:"파지 높이로 하강", close:"그리퍼 닫기", lift:"물체 들어 올리기", transfer:"트레이로 이동",
    lower:"트레이 위에서 하강", release:"물체 놓기", retreat:"그리퍼 후퇴", settle:"트레이 안착 판정"};
  const outcomes = {placed:"성공", placement_failed:"실패", execution_error:"실행 오류",
    inference_error:"추론 오류", agent_skip:"파지 보류"};
  let data, selected, displayedRuns = "";
  const seconds = (time) => time == null ? "—" : time.toFixed(2) + " s";
  const median = (xs) => {
    const ys = xs.filter(x => x != null).sort((a,b) => a-b);
    if (ys.length === 0) return null;
    const j = Math.floor(ys.length / 2);
    return ys.length % 2 ? ys[j] : (ys[j-1] + ys[j]) / 2;
  };
  function setImage(id, src) {
    if (src && el(id).getAttribute("src") !== src) el(id).src = src;
  }
  function update() {
    if (!data) return;
    const {runs, total, active, done, aborted} = data;
    el("count").textContent = runs.length + " / " + total;
    el("success").textContent = runs.length ? runs.filter(r => r.success).length + " / " + runs.length : "—";
    el("wall").textContent = seconds(median(runs.map(r => r.total_s)));
    el("inference").textContent = seconds(median(runs.map(r => r.inference_s)));
    el("progress").value = runs.length;
    const phase = active
      ? (active.trial + "회 · " + shapes[active.shape] + " · " + phases[active.phase] +
         (active.selection ? " · " + active.selection : ""))
      : (done ? (aborted ? "실험 중단" : "실험 완료") : "다음 회차 준비");
    el("phase").textContent = phase;
    el("batchClock").textContent = "전체 경과 " + seconds(done ? data.batch_s : Date.now()/1000 - data.run_started_unix_s);
    el("csv").hidden = el("json").hidden = !done;
    el("liveButton").hidden = selected == null;
    const chosen = runs.find(r => r.trial === selected);
    const recent = runs.at(-1);
    const observation = chosen || (active && active.rgbd ? active : recent);
    if (chosen) {
      setImage("sceneImage", chosen.replay || chosen.end_frame);
      el("sceneLabel").textContent = chosen.trial + "회 · " + (chosen.replay ? "물리 시간 재생" : "최종 장면");
    } else if (done && recent) {
      setImage("sceneImage", recent.replay || recent.end_frame);
      el("sceneLabel").textContent = recent.trial + "회 · " + (recent.replay ? "물리 시간 재생" : "최종 장면");
    } else if (active || recent) {
      setImage("sceneImage", "frame.jpg?t=" + Date.now());
      el("sceneLabel").textContent = "실시간";
    }
    if (observation?.rgbd) {
      setImage("rgbd", observation.rgbd);
      if (observation.evidence) {
        el("evidence").textContent = "파지 " + observation.selection + " · " + observation.evidence;
      } else if (observation.error) {
        el("evidence").textContent = observation.error;
      } else {
        el("evidence").textContent = observation.trial + "회 · 입력 관측";
      }
    }
    const tableKey = runs.length + "/" + selected;
    if (displayedRuns === tableKey) return;
    displayedRuns = tableKey;
    el("runs").replaceChildren(...runs.map(r => {
      const tr = document.createElement("tr");
      const values = [String(r.trial).padStart(2,"0"), shapes[r.shape], r.selection || "—",
        seconds(r.total_s), seconds(r.inference_s), seconds(r.sim_s), outcomes[r.outcome], ""];
      values.forEach((value, index) => {
        const td = tr.insertCell();
        td.textContent = value;
        if (index === 3) td.className = "time";
        if (index === 6) td.className = r.success ? "good" : "bad";
        if (index === 7 && (r.replay || r.rgbd)) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = r.replay ? "보기" : "관측";
          button.setAttribute("aria-label", r.trial + "회 " + button.textContent);
          button.setAttribute("aria-pressed", String(selected === r.trial));
          button.addEventListener("click", () => { selected = r.trial; update(); });
          td.append(button);
        }
      });
      return tr;
    }));
  }
  el("liveButton").addEventListener("click", () => { selected = null; update(); });
  async function poll() {
    try {
      const reply = await fetch("live.json", {cache:"no-store"});
      if (reply.ok) { data = await reply.json(); update(); }
    } catch (error) { el("phase").textContent = "상태 다시 불러오는 중"; }
    if (!data?.done) setTimeout(poll, 850);
  }
  poll();
</script>
</body></html>
